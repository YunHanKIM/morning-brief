# 배포된 앱의 POST /api/cron/brief를 수동으로 불러 브리핑을 만들고 저장하고 Telegram으로 보낸다.
# 매일 09:30 KST 예약 실행은 이 워크플로가 아니라 Cloudflare Worker(worker/)가 맡는다.
# GitHub 예약 실행이 몇 시간씩 밀려(2026-10-20에는 4시간 38분) 스케줄러만 옮겼다.
#
# 필요한 저장소 Secrets (Settings > Secrets and variables > Actions):
#   BRIEF_URL   배포 주소 (예: https://morning-brief.vercel.app, https만 허용)
#   CRON_SECRET 앱의 CRON_SECRET 환경변수와 같은 값
#
# 알아둘 점
# - 예약(schedule)을 다시 켜면 Worker와 겹쳐 Telegram이 중복 전송된다. 켜지 말 것
# - 재시도하지 않는다. 앱이 502를 돌려줘도 저장 또는 전송 중 한쪽은 이미 성공했을 수 있어
#   다시 부르면 Telegram이 중복 전송된다. 실패하면 Actions 탭에서 확인하고 수동 실행(workflow_dispatch)한다
name: Morning Brief

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 브리핑 만들기 (저장 + Telegram 전송)
        env:
          BRIEF_URL: ${{ secrets.BRIEF_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$BRIEF_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::BRIEF_URL, CRON_SECRET 저장소 secrets를 등록해야 합니다"
            exit 1
          fi
          case "$BRIEF_URL" in
            https://*) ;;
            *) echo "::error::BRIEF_URL은 https:// 로 시작해야 합니다"; exit 1 ;;
          esac
          curl --silent --show-error --fail-with-body --max-time 120 \
            --request POST "${BRIEF_URL%/}/api/cron/brief" \
            --header "Authorization: Bearer ${CRON_SECRET}"
          echo
